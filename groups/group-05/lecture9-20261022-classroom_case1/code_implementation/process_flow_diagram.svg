<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="650" viewBox="0 0 1450 650">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#334155"/></marker></defs>
<rect width="1450" height="650" fill="#ffffff"/>
<g font-family="Arial, Microsoft YaHei, sans-serif" fill="#14213d">
<text x="725" y="44" text-anchor="middle" font-size="25" font-weight="bold">废弃 PET 瓶砖机械物理再生物质流程（基准批次：1,000 kg）</text>
<rect x="20" y="190" width="140" height="90" rx="12" fill="#e0f2fe" stroke="#2563eb" stroke-width="2"/>
<text x="90" y="225" text-anchor="middle" font-size="16" font-weight="bold">废瓶砖</text>
<text x="90" y="250" text-anchor="middle" font-size="16" font-weight="normal">1,000 kg</text>
<rect x="210" y="190" width="160" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="290" y="225" text-anchor="middle" font-size="16" font-weight="bold">1. 脱包、筛选</text>
<text x="290" y="250" text-anchor="middle" font-size="16" font-weight="normal">与干式脱标</text>
<rect x="410" y="190" width="160" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="490" y="225" text-anchor="middle" font-size="16" font-weight="bold">2. 湿式粉碎</text>
<text x="490" y="250" text-anchor="middle" font-size="16" font-weight="normal">与热碱洗</text>
<rect x="610" y="190" width="160" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="690" y="225" text-anchor="middle" font-size="16" font-weight="bold">3. 密度浮选</text>
<text x="690" y="250" text-anchor="middle" font-size="16" font-weight="normal">分离槽</text>
<rect x="810" y="190" width="160" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="890" y="225" text-anchor="middle" font-size="16" font-weight="bold">4. 光学色选</text>
<text x="890" y="250" text-anchor="middle" font-size="16" font-weight="normal">脱水与干燥</text>
<rect x="1010" y="190" width="160" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="1090" y="225" text-anchor="middle" font-size="16" font-weight="bold">5. 挤出造粒</text>
<text x="1090" y="250" text-anchor="middle" font-size="16" font-weight="normal">与 SSP 增粘</text>
<rect x="1250" y="190" width="170" height="90" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="1335" y="225" text-anchor="middle" font-size="16" font-weight="bold">瓶级 rPET</text>
<text x="1335" y="250" text-anchor="middle" font-size="16" font-weight="normal">800 kg</text>
<path d="M160 235 H205" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="185" y="217" text-anchor="middle" font-size="14" font-weight="bold">1,000 kg</text>
<path d="M370 235 H405" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="390" y="217" text-anchor="middle" font-size="14" font-weight="bold">955 kg</text>
<path d="M570 235 H605" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="590" y="217" text-anchor="middle" font-size="14" font-weight="bold">920 kg</text>
<path d="M770 235 H805" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="790" y="217" text-anchor="middle" font-size="14" font-weight="bold">840 kg</text>
<path d="M970 235 H1005" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="990" y="217" text-anchor="middle" font-size="14" font-weight="bold">800 kg</text>
<path d="M1170 235 H1245" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1210" y="217" text-anchor="middle" font-size="14" font-weight="bold">800 kg</text>
<path d="M285 280 V360" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="205" y="365" width="160" height="76" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="285" y="400" text-anchor="middle" font-size="16" font-weight="bold">废标签膜 20 kg</text>
<text x="285" y="425" text-anchor="middle" font-size="16" font-weight="normal">泥沙与干灰 25 kg</text>
<path d="M485 280 V360" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="405" y="365" width="160" height="76" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="485" y="400" text-anchor="middle" font-size="16" font-weight="bold">洗涤杂质 35 kg</text>
<text x="485" y="425" text-anchor="middle" font-size="16" font-weight="normal">进入污水处理</text>
<path d="M685 280 V360" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="605" y="365" width="160" height="76" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="685" y="400" text-anchor="middle" font-size="16" font-weight="bold">HDPE 产品 75 kg</text>
<text x="685" y="425" text-anchor="middle" font-size="16" font-weight="normal">夹带损失 5 kg</text>
<path d="M885 280 V360" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="805" y="365" width="160" height="76" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="885" y="400" text-anchor="middle" font-size="16" font-weight="bold">黄变片与细粉</text>
<text x="885" y="425" text-anchor="middle" font-size="16" font-weight="normal">损失 40 kg</text>
<rect x="70" y="485" width="1310" height="98" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="725" y="519" text-anchor="middle" font-size="15" font-weight="normal">质量平衡：输入 1,000 kg = 标签 20 + 泥沙 25 + 洗涤杂质 35 + HDPE 夹带 5 + 色选损失 40 + HDPE 产品 75 + rPET 800 kg</text>
<text x="725" y="550" text-anchor="middle" font-size="15" font-weight="normal">主产品收率 = 800 / 1,000 = 80.0%；图中物流质量按讲义 MFA 基准值标注。</text>
</g></svg>