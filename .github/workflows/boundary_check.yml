name: "Group Boundary & Quality Guardrail"

on:
  pull_request:
    branches: [ "main" ]

jobs:
  check-boundaries:
    name: "Verify Group Directory Isolation & File Rules"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect Changed Files
        id: diff-check
        run: |
          echo "Comparing changes between origin/${{ github.base_ref }} and HEAD..."
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "Changed files list:"
          echo "$CHANGED_FILES"
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "No changed files detected. Skipping checks."
            exit 0
          fi

          # 1. Check for unauthorized Jupyter checkpoints or cache files
          if echo "$CHANGED_FILES" | grep -q "\.ipynb_checkpoints"; then
            echo "::error::Detected .ipynb_checkpoints cache files! Please remove local checkpoint files and verify that .gitignore is effective."
            exit 1
          fi

          # 2. Check student submission boundary (students may only modify their assigned group directory)
          if [ "${{ github.actor }}" != "ResearchGeekSQ" ]; then
            NON_GROUP_FILES=$(echo "$CHANGED_FILES" | grep -v "^groups/group-[0-9]\{2\}/" || true)
            if [ -n "$NON_GROUP_FILES" ]; then
              echo "::error::Boundary Violation: Student submissions are strictly restricted to your designated group directory (groups/group-XX/)!"
              echo "Unauthorized modified files detected outside group directory (students are not permitted to modify starter_materials/, CI workflows, or root files):"
              echo "$NON_GROUP_FILES"
              exit 1
            fi
          fi

          # 3. Check for cross-group modifications (each PR must touch only a single group directory)
          TOUCHED_GROUPS=$(echo "$CHANGED_FILES" | grep "^groups/group-[0-9]\{2\}/" | cut -d/ -f2 | sort -u)
          GROUP_COUNT=$(echo "$TOUCHED_GROUPS" | grep -v '^$' | wc -l)

          echo "Touched groups: $TOUCHED_GROUPS (Count: $GROUP_COUNT)"
          if [ "$GROUP_COUNT" -gt 1 ]; then
            echo "::error::Cross-group Violation: A single PR modified multiple group directories ($TOUCHED_GROUPS)! To ensure independent grading, modifying other groups' directories is strictly prohibited."
            exit 1
          fi

          if [ "${{ github.actor }}" != "ResearchGeekSQ" ] && [ "$GROUP_COUNT" -eq 0 ]; then
            echo "::error::No files belonging to any student group (groups/group-XX/) were detected in this PR!"
            exit 1
          fi

          # 4. Check single file size limit (max 25MB to prevent committing large raw datasets or archives)
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ -f "$f" ]; then
              size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null || echo 0)
              if [ "$size" -gt 26214400 ]; then
                echo "::error::File $f exceeds the 25MB limit ($size bytes)! Please do not commit oversized raw data files to the repository."
                exit 1
              fi
            fi
          done <<< "$CHANGED_FILES"

          echo "All group boundary checks and isolation guardrails passed successfully!"
