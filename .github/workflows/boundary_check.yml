name: "Group Boundary & Quality Guardrail"

on:
  pull_request:
    branches: [ "main" ]

jobs:
  check-boundaries:
    name: "Verify Group Directory Isolation & File Rules"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect Changed Files
        id: diff-check
        run: |
          echo "Comparing changes between origin/${{ github.base_ref }} and HEAD..."
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "Changed files list:"
          echo "$CHANGED_FILES"
          
          # 1. 检查是否误传 Jupyter 检查点文件
          if echo "$CHANGED_FILES" | grep -q "\.ipynb_checkpoints"; then
            echo "::error::发现 .ipynb_checkpoints 缓存文件！请在本地删除缓存并确保 .gitignore 正常生效。"
            exit 1
          fi

          # 2. 检查普通学生是否尝试篡改公共课件 (starter_materials/)
          if [ "${{ github.actor }}" != "ResearchGeekSQ" ]; then
            if echo "$CHANGED_FILES" | grep -q "^starter_materials/"; then
              echo "::error::越界警告：starter_materials/ 为教师公共课件区，学生只能从中复制，禁止直接修改！"
              exit 1
            fi
          fi

          # 3. 检查是否跨组修改（一个 PR 只能触及 groups/ 下的单一小组目录）
          TOUCHED_GROUPS=$(echo "$CHANGED_FILES" | grep "^groups/group-[0-9]\{2\}/" | cut -d/ -f2 | sort -u)
          GROUP_COUNT=$(echo "$TOUCHED_GROUPS" | grep -v '^$' | wc -l)

          echo "Touched groups: $TOUCHED_GROUPS (Count: $GROUP_COUNT)"
          if [ "$GROUP_COUNT" -gt 1 ]; then
            echo "::error::越界警告：单次提交修改了多个小组目录 ($TOUCHED_GROUPS)！为保证各组独立评分，严禁跨组修改。"
            exit 1
          fi

          # 4. 检查单文件体积是否超过 25MB（防止误提交大型数据集或虚拟机文件）
          for f in $CHANGED_FILES; do
            if [ -f "$f" ]; then
              size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null || echo 0)
              if [ "$size" -gt 26214400 ]; then
                echo "::error::文件 $f 超过 25MB 限制 ($size 字节)！请勿将超大原始数据提交入库。"
                exit 1
              fi
            fi
          done

          echo "✅ 所有边界检查与防冲突规则验证通过！"
