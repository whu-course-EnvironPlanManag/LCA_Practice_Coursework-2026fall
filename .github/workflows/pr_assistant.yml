name: "PR Auto Titler & Task Template Adapter"

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  assist-pr:
    name: "Standardize Title & Adapt Template"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Process PR Title and Match Template
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const headRef = pr.head.ref || ''; // Example: dev-tangsiqi-test

            console.log(`[PR Assistant] Processing PR #${pr.number} (Branch: ${headRef})`);

            // ==========================================
            // Step 1: Extract Metadata (Body Parsing + Branch Fallback)
            // ==========================================

            // 1.1 Group ID extraction (priority: branch name dev-group-XX-xxx -> body text)
            let groupMatch = headRef.match(/group-(\d{2})/i) || body.match(/(?:Group|小组|group)[^\d]*(\d{2})/i);
            let groupId = groupMatch ? `group-${groupMatch[1]}` : 'group-unknown';

            // 1.2 Detect modified task directory from changed files
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            let taskSlug = null;
            for (const file of files) {
              const match = file.filename.match(/^groups\/group-\d{2}\/([^\/]+)\//);
              if (match) {
                taskSlug = match[1];
                break;
              }
            }

            // 1.3 Student Name extraction (priority: body text -> branch name suffix)
            let studentName = null;
            const nameInBody = body.match(/(?:Student Name|学生姓名).*?[:：]\s*`?([a-zA-Z0-9_\-]+)`?/i);
            if (nameInBody && !nameInBody[1].includes('姓名全拼') && !nameInBody[1].includes('例如') && nameInBody[1].trim() !== '') {
              studentName = nameInBody[1].trim();
            } else {
              // Extract from branch name: dev-tangsiqi-test -> tangsiqi
              const branchParts = headRef.split('-');
              if (branchParts.length >= 4) {
                studentName = branchParts.slice(3).join('-');
              } else {
                studentName = pr.user.login || 'student';
              }
            }

            // 1.4 Lecture Number extraction
            let lectureNo = "09";
            const lectureMatch = body.match(/(?:Lecture|讲次|第)\s*\[?\s*(\d{1,2})\s*\]?\s*(?:讲|)/i);
            if (lectureMatch) {
              lectureNo = lectureMatch[1].padStart(2, '0');
            }

            // 1.5 Submission Date (body text extraction or current UTC+8 date fallback)
            let prDate = null;
            const dateMatch = body.match(/(\d{4}-\d{2}-\d{2})/);
            if (dateMatch) {
              prDate = dateMatch[1];
            } else {
              // UTC+8 Beijing Time
              prDate = new Date(Date.now() + 8 * 3600 * 1000).toISOString().split('T')[0];
            }

            // ==========================================
            // Step 2: Standardize PR Title and Update
            // ==========================================
            const taskDisplay = taskSlug || 'assignment';
            const standardizedTitle = `[${prDate} Lecture-${lectureNo} PR]: ${studentName} - ${taskDisplay} (${groupId})`;

            console.log(`[Titler] Standardized PR Title: "${standardizedTitle}"`);
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              title: standardizedTitle,
            });

            // Automatically label PR for easy categorization and filtering
            try {
              const labelsToAdd = [`lecture-${lectureNo}`, groupId];
              if (taskSlug) labelsToAdd.push(taskSlug);
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: labelsToAdd,
              });
              console.log(`[Labels] Added labels: ${labelsToAdd.join(', ')}`);
            } catch (err) {
              console.log(`[Labels] Skipped labeling: ${err.message}`);
            }

            // ==========================================
            // Step 3: Match and Inject Task-specific Template
            // ==========================================
            if (!taskSlug) {
              console.log("[Adapter] No specific task directory detected. Skipping template adapter.");
              return;
            }

            const templateDir = '.github/PULL_REQUEST_TEMPLATE';
            let matchedFile = null;

            if (fs.existsSync(templateDir)) {
              const allTemplates = fs.readdirSync(templateDir);
              // Match template file containing the taskSlug or case key (e.g. lecture9-20261022-classroom_case1)
              matchedFile = allTemplates.find(file => {
                if (file.includes(taskSlug)) return true;
                const normFile = file.toLowerCase().replace(/[^a-z0-9]/g, '');
                const normSlug = taskSlug.toLowerCase().replace(/[^a-z0-9]/g, '');
                if (normFile.includes(normSlug) || normSlug.includes(normFile)) return true;
                const caseMatch = taskSlug.match(/case[_-]?(\d+)/i);
                if (caseMatch && file.toLowerCase().includes(`case${caseMatch[1]}`)) return true;
                return false;
              });
            }

            if (matchedFile) {
              const templatePath = path.join(templateDir, matchedFile);
              const templateContent = fs.readFileSync(templatePath, 'utf8');

              const commentBody = `### 🤖 Course Teaching Assistant Bot\n\n` +
                `✅ **Standardized PR Title**: Renamed to **\`${standardizedTitle}\`**\n` +
                `📌 **Matched Task Template**: Detected modifications under directory **\`${taskSlug}\`**, associated with rubric **\`${matchedFile}\`**.\n\n` +
                `---\n\n` +
                `#### 📋 Task-specific Verification Checklist & Rubric:\n\n` +
                `${templateContent}\n\n` +
                `---\n*Notice: If you need to make corrections or additions, push commits to your branch directly. This PR will update automatically.*`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: commentBody,
              });
              console.log(`[Adapter] Successfully posted comment with template (${matchedFile})!`);
            } else {
              console.log(`[Adapter] No specialized template matching "${taskSlug}" found in ${templateDir}.`);
            }
